<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drpg</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a09; color: #e8dcc8; font: 14px system-ui, sans-serif; }
      canvas { display: block; image-rendering: pixelated; touch-action: none; } /* 터치 드래그를 브라우저 스크롤·확대가 가로채지 않게 */
      [hidden] { display: none !important; }
      body::after { content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, #000c 100%); }
      #hp, #target, #banner { z-index: 2; }
      .bar { width: 240px; height: 14px; background: #2a1414; border: 1px solid #000; }
      .bar i { display: block; width: 100%; height: 100%; background: #b3261e; }
      #hp { position: fixed; left: 20px; bottom: 20px; pointer-events: none; }
      #target { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
      #target span { display: block; margin-bottom: 4px; text-shadow: 0 1px 2px #000; }
      #banner { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 20px; font-size: 28px; background: #0008; pointer-events: none; }
      #banner p { margin: 0; }
      #restart { pointer-events: auto; font: inherit; font-size: 20px; padding: 10px 28px; color: #e8dcc8; background: #2a1414; border: 1px solid #b3261e; cursor: pointer; }
      html { cursor: url(sprites/cursor_normal.png) 0 0, auto; }
      canvas.attack { cursor: url(sprites/cursor_attack.png) 0 0, crosshair; }
      #credits-btn { position: fixed; right: 12px; bottom: 12px; z-index: 2; font: 12px system-ui, sans-serif; color: #8a7f70; background: none; border: 1px solid #3a3530; padding: 4px 10px; cursor: inherit; }
      #credits { max-width: min(480px, 90vw); color: #e8dcc8; background: #14100e; border: 1px solid #b3261e; line-height: 1.6; }
      #credits a { color: #e0a060; }
      #credits::backdrop { background: #000a; }
    </style>
  </head>
  <body>
    <div id="target" hidden><span></span><div class="bar"><i></i></div></div>
    <div id="hp" class="bar"><i></i></div>
    <div id="banner"><p>불러오는 중…</p><button id="restart" hidden>다시 시작 (R)</button></div>
    <button id="credits-btn" onclick="document.getElementById('credits').showModal()">크레딧</button>
    <dialog id="credits">
      <p>캐릭터 그림·마우스 커서: <a href="https://github.com/flareteam/flare-game" target="_blank" rel="noopener">Flare: Empyrean Campaign</a> — Clint Bellanger 외 Flare 기여자</p>
      <p>라이선스: <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC-BY-SA 3.0</a>. 프레임 선택, 장비 레이어 합성, 크기 조정, 색 수 감소를 거쳤으며 가공한 그림도 CC-BY-SA 3.0입니다.</p>
      <p><a href="sprites/CREDITS.txt" target="_blank">전체 크레딧 (CREDITS.txt)</a></p>
      <form method="dialog"><button>닫기</button></form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
